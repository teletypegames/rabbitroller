steps:
  - name: version
    image: alpine
    commands:
      - 'apk add --no-cache git make jq'
      - 'make ci-version'

  - name: build
    image: git.teletypegames.org/internal/ebitengine-builder:latest
    commands:
      - 'make ci-export'

  - name: binaries
    image: git.teletypegames.org/internal/ebitengine-builder:latest
    commands:
      - 'make ci-binaries'

  - name: artifact
    image: alpine
    environment:
      UPDATE_SERVER: https://teletypegames.org
      UPDATE_SECRET:
        from_secret: update_secret_key
    commands:
      - 'apk add --no-cache make curl'
      - 'make ci-upload'

  - name: publish
    image: alpine
    environment:
      UPDATE_SERVER: https://teletypegames.org
      UPDATE_SECRET:
        from_secret: update_secret_key
    commands:
      - 'apk add --no-cache make curl'
      - 'make ci-publish'
